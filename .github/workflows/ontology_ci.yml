name: Ontology CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-ontology:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v5 # 👈 Upgraded for Node 24 compliance

    - name: Set up Python Environment
      uses: actions/setup-python@v6 # 👈 Upgraded for Node 24 compliance
      with:
        python-version: '3.11'

    - name: Install Semantic Verification Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install rdflib pyshacl

    - name: Execute SHACL and SPARQL Test Framework
      run: |
        python validate_ontology.py
