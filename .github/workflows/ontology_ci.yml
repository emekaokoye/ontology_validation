name: Ontology CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-ontology:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v5 # 👈 Upgraded for Node 24 compliance

    - name: Set up Python Environment
      uses: actions/setup-python@v6 # 👈 Upgraded for Node 24 compliance
      with:
        python-version: '3.11'

    - name: Install Semantic Verification Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install rdflib pyshacl pylode==2.8.11 owlready2 # 👈 Added pylode dependency package here

    # ✅ NEW STEP: Fixes the pyLODE v3.4.1 site-packages bug
    - name: Patch pyLODE Environment Workspace File Bug
      run: |
        SITE_PACKAGES_DIR=$(python -c "import site; print(site.getsitepackages()[0])")
        touch "$SITE_PACKAGES_DIR/pyproject.toml"


    - name: Execute Reasoner, SHACL, SPARQL, and pyLODE Framework
      run: |
        python validate_ontology.py
